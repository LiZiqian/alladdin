<!doctype html>
<meta charset="utf-8">
<title>XLSX parser browser regressions</title>
<h1>XLSX parser browser regressions</h1>
<p id="result">Running…</p>
<label>Verify a sample import template: <input id="template" type="file" accept=".xlsx"></label>
<pre id="templateResult"></pre>
<script src="../frontend/js/utils.js"></script>
<script>
(() => {
  let checks = 0;
  const equal = (actual, expected, label) => {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`${label}: ${JSON.stringify(actual)} !== ${JSON.stringify(expected)}`);
    checks++;
  };
  const rejects = (callback, label) => {
    try { callback(); } catch (error) { if (/XLSX/.test(error.message)) { checks++; return; } throw error; }
    throw new Error(`${label}: expected rejection`);
  };
  const worksheet = body => `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
  try {
    equal(Utils.parseXlsxSharedStrings('<sst><si><t>SN</t></si><si><r><t>测</t></r><r><t>试</t></r><rPh><t>phonetic</t></rPh></si></sst>'), ['SN', '测试'], 'rich strings omit phonetic guides');
    equal(Utils.parseXlsxSheet(worksheet('<row r="1"><c t="inlineStr"><is><t>SN</t></is></c><c t="inlineStr"><is><r><t>备</t></r><r><t>注</t></r></is></c></row><row r="2"><c><v>123</v></c><c t="s"><v>0</v></c></row>'), ['中文']), [['SN', '备注'], ['123', '中文']], 'implicit references preserve columns');
    const styled = Utils.parseXlsxDateStyles('<styleSheet><numFmts><numFmt numFmtId="164" formatCode="0 &quot;days&quot;"/><numFmt numFmtId="165" formatCode="yyyy-mm-dd"/></numFmts><cellXfs><xf numFmtId="0"/><xf numFmtId="14"/><xf numFmtId="164"/><xf numFmtId="165"/></cellXfs></styleSheet>');
    equal(Array.from(styled), ['1', '3'], 'quoted format literals are not date formats');
    equal(Utils.parseXlsxSheet(worksheet('<row r="1"><c r="A1" s="1"><v>0</v></c><c r="B1"><f>1+2</f><v>3</v></c></row>'), [], styled, { date1904: true }), [['1904-01-01', '3']], '1904 dates and cached formulas');
    const files = {
      'xl/worksheets/sheet1.xml': 'second', 'xl/worksheets/sheet9.xml': 'first',
      'xl/workbook.xml': '<workbook xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><workbookPr date1904="1"/><sheets><sheet name="First" r:id="r9"/><sheet name="Second" r:id="r1"/></sheets></workbook>',
      'xl/_rels/workbook.xml.rels': '<Relationships><Relationship Id="r1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="r9" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet9.xml"/></Relationships>',
    };
    equal(Utils.firstXlsxWorksheet(files), { path: 'xl/worksheets/sheet9.xml', date1904: true }, 'workbook order overrides archive order');
    equal(Utils.firstXlsxWorksheet({ 'xl/worksheets/sheet10.xml': '', 'xl/worksheets/sheet2.xml': '' }).path, 'xl/worksheets/sheet2.xml', 'legacy fallback uses natural sheet order');
    const invalidRows = [
      '<row r="1"><c r="A1"><f>1+2</f></c></row>',
      '<row r="1"><c r="A1" t="e"><v>#REF!</v></c></row>',
      '<row r="1"><c r="A1" t="s"><v>99</v></c></row>',
      '<row r="1"><c r="A0"><v>1</v></c></row>',
      '<row r="1"><c r="A2"><v>1</v></c></row>',
      '<row r="1"><c r="XFE1"><v>1</v></c></row>',
      '<row r="1"><c r="A1"><v>1</v></c><c r="A1"><v>2</v></c></row>',
      '<row r="1"/><row r="1"/>',
      '<row r="1"><c r="A1" s="999"><v>1</v></c></row>',
    ];
    invalidRows.forEach((row, index) => rejects(() => Utils.parseXlsxSheet(worksheet(row), [], styled), `invalid cell case ${index}`));
    rejects(() => Utils.parseXlsxSheet('<worksheet><sheetData>'), 'broken XML');
    rejects(() => Utils.parseXlsxSharedStrings('<!DOCTYPE sst [<!ENTITY a "evil">]><sst/>'), 'entity declarations');
    rejects(() => Utils.firstXlsxWorksheet({ ...files, 'xl/_rels/workbook.xml.rels': '<Relationships/>' }), 'missing worksheet relation');
    equal(Utils.excelSerialToDate(1462.99999), '1904-01-01', 'time-of-day does not change calendar date');
    window.testResult = { ok: true, checks };
  } catch (error) { window.testResult = { ok: false, checks, error: error.stack }; }
  document.querySelector('#result').textContent = JSON.stringify(window.testResult, null, 2);
  document.querySelector('#template').addEventListener('change', async event => {
    const file = event.target.files[0];
    const buffer = await file.arrayBuffer();
    const files = await Utils.unzipXlsxFiles(buffer);
    const sheet = Utils.firstXlsxWorksheet(files);
    const matrix = Utils.parseXlsxSheet(files[sheet.path], Utils.parseXlsxSharedStrings(files['xl/sharedStrings.xml'] || ''), Utils.parseXlsxDateStyles(files['xl/styles.xml'] || ''), { date1904: sheet.date1904 });
    const result = await Utils.parseSampleImportXlsx(buffer);
    window.templateResult = { file: file.name, sheet: sheet.path, matrixRows: matrix.length, header: matrix[0], error: result.error, rows: result.rows.length, first: result.rows[0] };
    document.querySelector('#templateResult').textContent = JSON.stringify(window.templateResult, null, 2);
  });
})();
</script>
